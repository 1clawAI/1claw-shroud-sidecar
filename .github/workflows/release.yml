name: Shroud sidecar — Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  # No `id-token: write`: nothing here publishes to npm. See the note above the
  # GitHub Release step.

env:
  BINARY_NAME: shroud-sidecar

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.3"

      - name: Version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build tarballs
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build_one() {
            local goos="$1" goarch="$2" suffix="$3"
            local outdir="dist/${BINARY_NAME}_${suffix}"
            mkdir -p "$outdir"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "$outdir/${BINARY_NAME}" .
            (cd dist && tar -czf "${BINARY_NAME}_${suffix}.tar.gz" "$(basename "$outdir")")
          }
          build_one linux amd64 linux_amd64
          build_one darwin arm64 darwin_arm64
          (cd dist && sha256sum "${BINARY_NAME}"_*.tar.gz | tee checksums.txt)

      - name: GHCR image name (lowercase)
        id: image
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ steps.image.outputs.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The npm platform packages are NOT published here.
      #
      # They are published from the monorepo by
      # `.github/workflows/publish-shroud-sidecar.yml`, which is where the other
      # submodule packages (@1claw/mcp, @1claw/browser-bridge) are published
      # from and where Trusted Publishing and the first-publish secrets are
      # configured. This repository has no secrets and no npm environment, so a
      # publish step here could only ever fail.
      #
      # Versions live in `npm/*/package.json` and are bumped deliberately, the
      # same discipline as the other two: the monorepo workflow skips a version
      # already on npm, so a publish happens when that number changes.
      #
      # This job still builds the tarballs, pushes the GHCR image and cuts the
      # GitHub release, which is what `install.sh` and the container path use.

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/shroud-sidecar_linux_amd64.tar.gz
            dist/shroud-sidecar_darwin_arm64.tar.gz
            dist/checksums.txt
          generate_release_notes: true
