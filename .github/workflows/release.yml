name: Shroud sidecar — Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  # Trusted Publishing (OIDC) for the npm step below. The monorepo's eight
  # publish workflows authenticate this way and hold no npm token; this one
  # has to match, or it is the only long-lived publish credential we own.
  id-token: write

env:
  BINARY_NAME: shroud-sidecar

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"

      - name: Version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build tarballs
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build_one() {
            local goos="$1" goarch="$2" suffix="$3"
            local outdir="dist/${BINARY_NAME}_${suffix}"
            mkdir -p "$outdir"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "$outdir/${BINARY_NAME}" .
            (cd dist && tar -czf "${BINARY_NAME}_${suffix}.tar.gz" "$(basename "$outdir")")
          }
          build_one linux amd64 linux_amd64
          build_one darwin arm64 darwin_arm64
          (cd dist && sha256sum "${BINARY_NAME}"_*.tar.gz | tee checksums.txt)

      - name: GHCR image name (lowercase)
        id: image
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.image.outputs.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # One npm package per target, carrying only that platform's binary.
      #
      # Hermes depends on both under optionalDependencies and npm installs the
      # one matching the host, so the version is pinned by Hermes' lockfile and
      # npm verifies the tarball against the integrity hash recorded there.
      # Nothing has to run a shell or reach GitHub at install time.
      #
      # Built from the same `dist/` this job already produced, so a published
      # package version can only contain a binary built from this tag.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Use an npm that supports Trusted Publishing
        run: |
          # Pinned exactly, not @latest or a range, and bumped deliberately in
          # one commit across every publish workflow. This runs in a job holding
          # id-token: write immediately before publishing public packages, so
          # whatever this resolves to executes with the credential that
          # publishes them.
          npm install -g npm@11.5.1
          npm --version

      - name: Stage platform packages
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # The tag is vX.Y.Z; npm wants X.Y.Z.
          NPM_VERSION="${VERSION#v}"
          stage() {
            local dir="$1" suffix="$2"
            install -m 0755 "dist/${BINARY_NAME}_${suffix}/${BINARY_NAME}" "npm/${dir}/bin/${BINARY_NAME}"
            rm -f "npm/${dir}/bin/.gitkeep"
            node -e '
              const fs = require("fs");
              const p = process.argv[1], v = process.argv[2];
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              j.version = v;
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            ' "npm/${dir}/package.json" "$NPM_VERSION"
          }
          stage linux-x64 linux_amd64
          stage darwin-arm64 darwin_arm64
          # The binary must be present and executable, or we would publish an
          # empty package that resolves and then fails at spawn.
          for d in linux-x64 darwin-arm64; do
            test -x "npm/$d/bin/${BINARY_NAME}" || { echo "npm/$d has no executable binary"; exit 1; }
          done

      # Auth, in the shape the monorepo's publish workflows settled on.
      #
      # Steady state is Trusted Publishing (OIDC) and no token at all. But OIDC
      # cannot perform a package's *first* publish: there is no package yet for
      # a trusted publisher to be configured against. So a first release needs
      # a token, and only a first release.
      #
      # The secret is named for this package rather than given the generic name,
      # so it cannot be picked up by — or copy-pasted into — a workflow that is
      # working without one. (Spelled out rather than quoted here: a comment
      # holding the generic name is a false hit for anyone grepping the
      # workflows for which credentials they reference.)
      #
      # An earlier version of this step used that generic name, which exists in
      # neither this repository nor the monorepo, and set it as
      # `NODE_AUTH_TOKEN` unconditionally — an empty token suppresses OIDC, and
      # npm answers a failed auth on a scoped package with 404, which reads as
      # a missing package.
      #
      # **Delete the secret once both names exist on npm and Trusted Publishing
      # is configured for them.** A long-lived publish token is what OIDC exists
      # to remove, and npm is actively revoking the 2FA-bypassing ones.
      - name: Publish platform packages
        env:
          FIRST_PUBLISH_TOKEN: ${{ secrets.NPM_TOKEN_SHROUD_SIDECAR }}
        run: |
          set -euo pipefail
          for d in linux-x64 darwin-arm64; do
            name=$(node -p "require('./npm/$d/package.json').name")
            version=$(node -p "require('./npm/$d/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published; nothing to do."
            elif npm view "$name" name >/dev/null 2>&1; then
              # The name exists, so OIDC can publish a new version of it.
              npm publish "./npm/$d" --access public
            elif [ -n "${FIRST_PUBLISH_TOKEN:-}" ]; then
              echo "$name is new on npm — first publish with NPM_TOKEN_SHROUD_SIDECAR"
              NODE_AUTH_TOKEN="$FIRST_PUBLISH_TOKEN" npm publish "./npm/$d" --access public
            else
              # A warning, not a failure: the tarballs, the GHCR image and the
              # GitHub release are all still worth producing, and Hermes lists
              # these packages as *optional* dependencies precisely so a missing
              # one degrades to the PATH lookup instead of breaking installs.
              echo "::warning::$name does not exist on npm yet and NPM_TOKEN_SHROUD_SIDECAR is not set — add a granular npm token with publish rights for @1claw as that secret in this repository and re-run. Until then Hermes falls back to a binary on PATH."
            fi
          done

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/shroud-sidecar_linux_amd64.tar.gz
            dist/shroud-sidecar_darwin_arm64.tar.gz
            dist/checksums.txt
          generate_release_notes: true
