name: Shroud sidecar — CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.3"

      - name: Test
        run: go test ./...

      - name: Build (release flags)
        run: |
          VERSION="ci-${GITHUB_SHA:0:7}"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o /tmp/shroud-sidecar .
